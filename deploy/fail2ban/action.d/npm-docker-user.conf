[Definition]
actionstart = iptables -n -L DOCKER-USER >/dev/null 2>&1
actionstop =
actioncheck = iptables -n -L DOCKER-USER >/dev/null 2>&1
actionban = iptables -I DOCKER-USER 1 -s <ip> -m comment --comment "f2b-<name>" -j DROP
actionunban = iptables -D DOCKER-USER -s <ip> -m comment --comment "f2b-<name>" -j DROP

[Init]
name = npm-docker-user
