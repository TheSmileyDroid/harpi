{% extends "base.html" %}

{% block title %}Settings - Harpi{% endblock %}

{% block content %}
  <div class="page-transition settings-layout">
    <nav class="settings-nav" aria-label="Settings sections">
      <ul class="settings-nav-list" role="list">
        {% for section, tab in settings_sections.items() %}
          <li>
            <button
              class="settings-nav-item {% if loop.first %}active{% endif %}"
              hx-get="{{ url_for('htmx_routes.htmx_settings_section', section=section) }}"
              hx-target="#settings-content"
              hx-swap="innerHTML"
              hx-push-url="false"
              aria-label="{{ tab.label }} settings"
            >
              <i
                class="bi bi-{{ tab.icon }} settings-nav-icon"
                aria-hidden="true"
              ></i>
              <span>{{ tab.label }}</span>
            </button>
          </li>
        {% endfor %}
      </ul>
    </nav>

    <div class="settings-content" id="settings-content">
      {% include "partials/_settings_general.html" %}
    </div>
  </div>
{% endblock %}
