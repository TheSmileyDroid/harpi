<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Harpi - System Panel" />
    <meta name="keywords" content="harpi, discord, bot, music, panel" />
    <title>{% block title %}Harpi - System Panel{% endblock title %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Rajdhani:wght@600&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      href="{{ url_for('static', filename='assets/favicon.svg') }}"
    />

    <script
      src="{{ url_for('static', filename='js/htmx.min.js') }}"
      defer
    ></script>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />

    {% block extra_head %}{% endblock extra_head %}
  </head>
  <body class="bg-background text-primary w-full h-full">
    <div class="app-container w-full">
      <header class="flex w-full" role="banner">
        <div class="top-bar-left ">
          <a class="logo" aria-label="Harpi Home" href="/">
            <img
              src="{{ url_for('static', filename='assets/favicon.svg') }}"
              alt=""
              class="logo-icon"
              width="24"
              height="24"
            />
            <span class="logo-text">HARPI</span>
          </a>
        </div>

        <div class="top-bar-center">
          <nav class="main-nav" role="navigation" aria-label="Main navigation">
            {% set music_url = url_for('music.music') %}
            <a
              href="/"
              {% if request.path == '/' %}aria-current="page"{% endif %}
              >Home</a
            >
            <a
              href="{{ music_url }}"
              {% if request.path == music_url %}aria-current="page"{% endif %}
              >Music</a
            >
          </nav>
        </div>

        <div class="self-center justify-end">
          <div
            id="bot-status"
            hx-get="{{ url_for('index.status') }}"
            hx-trigger="load, every 2s"
            hx-swap="innerHTML"
          ></div>
        </div>
      </header>

      <main id="main" class="main-content" role="main">
        {% block content %}{% endblock content %}
      </main>

      <footer class="status-strip" role="contentinfo">
        <span class="strip-credit">
          made by
          <a href="https://github.com/TheSmileyDroid" target="_blank"
            >smileydroid</a
          >
        </span>
      </footer>
    </div>

    <div
      id="toast-container"
      class="toast-container"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    <div
      id="global-indicator"
      class="global-indicator"
      aria-hidden="true"
    ></div>

    <script id="toast-script">
      // Enhancement only: the server declares the confirmation through
      // the HX-Trigger response header (pages/music.py only sets it on
      // successful actions); this listener just renders what arrived
      // into #toast-container, which sits outside every poller swap
      // region, so toasts stack and never get wiped by a poll. Each
      // toast removes itself after a few seconds. Errors never arrive
      // here — they stay in #panel_error, red and persistent.
      (() => {
        if (document.body.dataset.toastBound) return;
        document.body.dataset.toastBound = "true";
        const TOAST_MS = 4000;
        document.body.addEventListener("harpi:toast", (evt) => {
          const container = document.getElementById("toast-container");
          if (!container || !evt.detail?.message) return;
          const toast = document.createElement("div");
          toast.className = "toast";
          toast.setAttribute("role", "status");
          toast.textContent = evt.detail.message;
          container.appendChild(toast);
          setTimeout(() => toast.remove(), TOAST_MS);
        });
      })();
    </script>

    <script>
      // One subtle global indicator for HTMX activity; per-action
      // feedback is the .htmx-request class htmx puts on the trigger.
      // Background pollers (hx-trigger containing "every") are excluded:
      // the 2s status polls must be visually silent (design.md), so they
      // neither raise nor lower the bar.
      (() => {
        const bar = document.getElementById("global-indicator");
        if (!bar) return;
        let pending = 0;
        const isPoll = (evt) =>
          evt.detail.elt?.getAttribute("hx-trigger")?.includes("every") ??
          false;
        const sync = () => bar.classList.toggle("is-busy", pending > 0);
        document.body.addEventListener("htmx:beforeRequest", (evt) => {
          if (isPoll(evt)) return;
          pending += 1;
          sync();
        });
        const done = (evt) => {
          if (isPoll(evt)) return;
          pending = Math.max(0, pending - 1);
          sync();
        };
        document.body.addEventListener("htmx:afterRequest", done);
        document.body.addEventListener("htmx:responseError", done);
        document.body.addEventListener("htmx:sendError", done);
      })();
    </script>

    {% block extra_scripts %}{% endblock extra_scripts %}
  </body>
</html>
