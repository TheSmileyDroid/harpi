<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Harpi - System Panel" />
    <meta name="keywords" content="harpi, discord, bot, music, panel" />
    <title>{% block title %}Harpi - System Panel{% endblock title %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@300..700&family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />

    <link
      rel="icon"
      href="{{ url_for('static', filename='assets/favicon.svg') }}"
    />

    <script
      src="{{ url_for('static', filename='js/htmx.min.js') }}"
      defer
    ></script>

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/app.css') }}"
    />

    {% block extra_head %}{% endblock extra_head %}
  </head>
  <body class="bg-background text-primary w-full h-full">
    <div class="app-container w-full">
      <header class="flex w-full" role="banner">
        <div class="top-bar-left ">
          <a class="logo" aria-label="Harpi Home" href="/">
            <img
              src="{{ url_for('static', filename='assets/favicon.svg') }}"
              alt=""
              class="logo-icon"
              width="24"
              height="24"
            />
            <span class="logo-text">HARPI</span>
          </a>
        </div>

        <div class="top-bar-center">
          <nav class="main-nav" role="navigation" aria-label="Main navigation">
            <a href="/">Home</a>
            <a href="{{ url_for('music.music') }}">Music</a>
          </nav>
        </div>

        <div class="self-center justify-end">
          <div
            id="bot-status"
            hx-get="{{ url_for('index.status') }}"
            hx-trigger="load, every 2s"
            hx-swap="innerHTML"
          ></div>
        </div>
      </header>

      <main id="main" class="main-content" role="main">
        {% block content %}{% endblock content %}
      </main>

      <footer class="status-strip" role="contentinfo">
        <span class="strip-credit">
          made by
          <a href="https://github.com/TheSmileyDroid" target="_blank"
            >smileydroid</a
          >
        </span>
      </footer>
    </div>

    <div
      id="toast-container"
      class="toast-container"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    {% block extra_scripts %}{% endblock extra_scripts %}
  </body>
</html>
