<!doctype html>
<html lang="en" data-theme="retro">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}Harpi - System Panel{% endblock %}</title>

    <link
      rel="icon"
      href="{{ url_for('static', filename='assets/favicon.svg') }}"
    />

    <meta name="htmx-config" content='{"historyEnabled":false}' />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/crt-theme.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/components.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/htmx-indicators.css') }}"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='css/bootstrap-icons.css') }}"
    />

    <script
      src="{{ url_for('static', filename='js/htmx.min.js') }}"
      defer
    ></script>
    <script
      src="{{ url_for('static', filename='js/alpine.min.js') }}"
      defer
    ></script>

    {% block extra_head %}{% endblock %}
  </head>
  <body>
    <div class="crt-scanlines" aria-hidden="true"></div>
    <div class="crt-viggette" aria-hidden="true"></div>
    <div class="crt-curvature" aria-hidden="true"></div>

    <div class="app-container">
      <header class="top-bar" role="banner">
        <div class="top-bar-left">
          <a
            class="logo"
            aria-label="Harpi Home"
            href="{{ url_for('html_routes.route', page='dashboard') }}"
          >
            <img
              src="{{ url_for('static', filename='assets/favicon.svg') }}"
              alt=""
              class="logo-icon"
              width="24"
              height="24"
            />
            <span class="logo-text">HARPI</span>
            <span class="logo-sub">System Panel</span>
          </a>
        </div>

        <div class="top-bar-center">
          <nav class="main-nav" role="navigation" aria-label="Main navigation">
            {% for item in nav_items %}
              <a
                class="nav-link"
                href="{{ url_for('html_routes.route', page=item.page) }}"
              >
                <i
                  class="bi bi-{{ item.icon }} nav-icon"
                  aria-hidden="true"
                ></i>
                <span>{{ item.label }}</span>
              </a>
            {% endfor %}
          </nav>
        </div>

        <div class="top-bar-right">
          <div class="bot-status" id="bot-status">
            <span
              class="status-dot {% if bot_connected %}connected{% else %}disconnected{% endif %}"
              aria-hidden="true"
            ></span>
            <span class="status-text"
              >{% if bot_connected %}ONLINE{% else %}OFFLINE{% endif %}</span
            >
          </div>
        </div>
      </header>

      <main id="main-content" class="main-content" role="main">
        {% block content %}
        {% endblock %}
      </main>

      <footer class="app-footer" role="contentinfo">
        <div class="footer-left">
          <span class="version">v{{ version }}</span>
          <span class="separator">|</span>
          <span class="latency" id="latency-display">--ms</span>
        </div>
        <div class="footer-center">
          <span class="crt-label">OMEGA NETWORK</span>
        </div>
        <div class="footer-right">
          <span class="time" id="current-time">00:00:00</span>
        </div>
      </footer>
    </div>

    <div
      x-data="{ modalOpen: false, modalContent: '', modalTitle: 'Modal' }"
      x-init="window.harpiModal = $refs.modal"
      class="modal-container"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modal-title"
      style="display: none;"
    >
      <div
        class="modal-overlay"
        @click="modalOpen = false"
        aria-hidden="true"
      ></div>
      <div
        class="modal-window"
        role="document"
        x-ref="modal"
        x-show="modalOpen"
        x-transition
      >
        <div class="modal-header">
          <h2 id="modal-title" x-text="modalTitle"></h2>
          <button
            class="modal-close"
            @click="modalOpen = false"
            aria-label="Close modal"
          >
            <i class="bi bi-x" aria-hidden="true"></i>
          </button>
        </div>
        <div class="modal-body" x-html="modalContent"></div>
      </div>
    </div>

    <div
      id="toast-container"
      class="toast-container"
      aria-live="polite"
      aria-atomic="true"
    ></div>

    {% block extra_scripts %}{% endblock %}

    <script>
      // Handle toast notifications
      window.showToast = function (message, type = "info", duration = 5000) {
        const container = document.getElementById("toast-container");
        const toast = document.createElement("div");
        toast.className = `toast toast-${type}`;
        toast.setAttribute("role", "alert");

        const iconSpan = document.createElement("span");
        const icon =
          type === "error"
            ? "x-circle"
            : type === "success"
              ? "check-circle"
              : "info-circle";
        iconSpan.className = `toast-icon bi bi-${icon}`;
        iconSpan.setAttribute("aria-hidden", "true");
        toast.appendChild(iconSpan);

        const msgSpan = document.createElement("span");
        msgSpan.className = "toast-message";
        msgSpan.textContent = message;
        toast.appendChild(msgSpan);

        const closeBtn = document.createElement("button");
        closeBtn.className = "toast-close";
        closeBtn.setAttribute("aria-label", "Dismiss");
        closeBtn.innerHTML = '<i class="bi bi-x" aria-hidden="true"></i>';
        toast.appendChild(closeBtn);

        container.appendChild(toast);

        // Animate in
        requestAnimationFrame(() => toast.classList.add("show"));

        // Auto dismiss
        setTimeout(() => {
          toast.classList.remove("show");
          setTimeout(() => toast.remove(), 300);
        }, duration);

        // Manual dismiss
        toast.querySelector(".toast-close").addEventListener("click", () => {
          toast.classList.remove("show");
          setTimeout(() => toast.remove(), 300);
        });
      };
    </script>
  </body>
</html>
