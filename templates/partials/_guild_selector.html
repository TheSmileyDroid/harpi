{# templates/partials/_guild_selector.html #}
<div class="guild-channel-selector" id="guild-channel-selector">
    <!-- Guild/Channel Selection Form -->
    <form id="guild-channel-form" hx-post="{{ url_for('htmx_routes.guild_select_channel') }}" hx-target="#bot-status" hx-swap="outerHTML" hx-indicator="#connect-spinner">
        <!-- Guild Selector -->
        <div class="select-wrapper">
            <select
                id="guild-select"
                name="guild_id"
                hx-get="{{ url_for('htmx_routes.htmx_channels') }}"
                hx-trigger="change"
                hx-target="#channel-selector-container"
                hx-swap="innerHTML"
                aria-label="Select Discord server">
                <option value="">SELECT GUILD</option>
                {% for guild in guilds %}
                <option value="{{ guild.id }}" {% if guild.id == selected_guild_id %}selected{% endif %}>
                    {{ guild.name }}
                </option>
                {% endfor %}
            </select>
        </div>

        <!-- Channel Selector Container (HTMX target) -->
        <div id="channel-selector-container" class="select-wrapper">
            {% if selected_guild_id %}
                {% include "partials/_channel_selector.html" with context %}
            {% else %}
                <select id="channel-select" name="channel_id" disabled aria-label="Select voice channel">
                    <option value="">SELECT GUILD FIRST</option>
                </select>
            {% endif %}
        </div>

        <!-- Connect Button -->
        <button
            type="submit"
            class="btn btn-primary btn-sm"
            {% if not selected_guild_id or not channels %}disabled{% endif %}
            aria-label="Connect to voice channel">
            <span>CONNECT</span>
            <span class="htmx-indicator spinner spinner-sm" id="connect-spinner"></span>
        </button>
    </form>
</div>
