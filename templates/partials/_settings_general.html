<div class="settings-section">
  <h3 class="settings-section-title">GENERAL SETTINGS</h3>

  <div class="settings-form-row">
    <div class="form-group">
      <label class="form-label" for="prefix">COMMAND PREFIX</label>
      <input
        type="text"
        id="prefix"
        class="form-input"
        value="{{ config.prefix | default(config.DEFAULT_PREFIX) }}"
        hx-post="{{ url_for('htmx_routes.api_settings_update', section='general') }}"
        hx-vals="js:{prefix: this.value}"
        hx-trigger="change"
        hx-target="#toast-container"
        hx-swap="beforeend"
        placeholder="!"
      />
      <span class="form-help"
        >The prefix used before bot commands (e.g., !play)</span
      >
    </div>

    <div class="form-group">
      <label class="form-label" for="language">LANGUAGE</label>
      <select
        id="language"
        class="form-select"
        hx-post="{{ url_for('htmx_routes.api_settings_update', section='general') }}"
        hx-vals="js:{language: this.value}"
        hx-trigger="change"
        hx-target="#toast-container"
        hx-swap="beforeend"
      >
        <option value="en" {% if config.language == 'en' %}selected{% endif %}>
          English
        </option>
        <option
          value="pt-BR"
          {% if config.language == 'pt-BR' %}selected{% endif %}
        >
          Português (Brasil)
        </option>
      </select>
      <span class="form-help">Bot response language</span>
    </div>
  </div>

  <div class="form-group">
    <div class="form-check">
      <input
        type="checkbox"
        id="auto-connect"
        class="form-check-input"
        {% if config.auto_connect %}checked{% endif %}
        hx-post="{{ url_for('htmx_routes.api_settings_update', section='general') }}"
        hx-vals="js:{auto_connect: this.checked}"
        hx-trigger="change"
        hx-target="#toast-container"
        hx-swap="beforeend"
      />
      <label class="form-check-label" for="auto-connect"
        >Auto-connect to voice on startup</label
      >
    </div>
  </div>

  <div class="form-group">
    <div class="form-check">
      <input
        type="checkbox"
        id="debug-mode"
        class="form-check-input"
        {% if config.debug_mode %}checked{% endif %}
        hx-post="{{ url_for('htmx_routes.api_settings_update', section='general') }}"
        hx-vals="js:{debug_mode: this.checked}"
        hx-trigger="change"
        hx-target="#toast-container"
        hx-swap="beforeend"
      />
      <label class="form-check-label" for="debug-mode"
        >Debug mode (verbose logging)</label
      >
    </div>
  </div>
</div>

<div class="settings-section">
  <h3 class="settings-section-title">ABOUT</h3>
  <div
    class="panel"
    style="padding: var(--space-md); font-size: 0.85rem; color: var(--color-text-dim);"
  >
    <p><strong>Harpi</strong> - Discord Bot v{{ version }}</p>
    <p style="margin-top: var(--space-sm);">
      The most complete Discord Bot for TTRPG sessions. Music, TTS, dice rolls,
      and more.
    </p>
    <p style="margin-top: var(--space-sm);">Made by SmileyDroid</p>
  </div>
</div>
