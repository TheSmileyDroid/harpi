{# templates/partials/_channel_selector.html #}
<select 
    id="channel-select" 
    name="channel_id"
    {% if not channels %}disabled{% endif %}
    aria-label="Select voice channel"
    onchange="if(this.value) this.closest('form').requestSubmit()">
    <option value="">SELECT CHANNEL</option>
    {% for channel in channels %}
    <option value="{{ channel.id }}" {% if channel.id == selected_channel_id %}selected{% endif %}>
        {{ channel.name }}
        {% if channel.user_limit > 0 %}({{ channel.voice_states|length }}/{{ channel.user_limit }}){% else %}({{ channel.voice_states|length }}){% endif %}
    </option>
    {% endfor %}
</select>
