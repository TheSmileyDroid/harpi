[project]
name = "harpi"
version = "0.1.0"
requires-python = ">=3.13"
authors = [{ name = "TheSmileyDroid", email = "ghsilha@gmail.com" }]
dependencies = [
    "cryptography>=45.0.3",
    "discord.py[voice]>=2.5.2",
    "djlint>=1.39.0,<1.39.3",
    "gtts>=2.5.4",
    "hypercorn>=0.18.0",
    "jinja2>=3.1.6",
    "jinja2-fragments>=0.10.0",
    "loguru>=0.7.3",
    "numpy>=2.4.0",
    "pillow>=11.2.1",
    "playwright>=1.61.0",
    "psutil>=7.0.0",
    "pytailwindcss>=0.3.1",
    "pydantic>=2.13.4",
    "pydub>=0.25.1",
    "python-dotenv>=1.1.0",
    "python-socketio>=5.11.0",
    "pytz>=2025.2",
    "quart>=0.20.0",
    "quart-schema>=0.23.0",
    "ruff>=0.16.0",
    "safebag>=0.2.0",
    "ty>=0.0.65",
    "uvicorn[standard]>=0.34.3",
    "vulture>=2.16",
    "websockets>=15.0.1",
    "wikipedia-api>=0.8.1",
    "yt-dlp>=2025.10.22",
    "yt-dlp-ejs>=0.3.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "radon",
    "mutmut<3.6",
    # 3.6+ asserts no trampoline hit module may start with `src.`, which
    # this repo's import layout (`from src.x import y`) violates on every
    # mutated call, so stats collection always crashes.
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]

[tool.ruff]
line-length = 79

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "env",
]

[tool.ruff.lint]
preview = true

select = ["E4", "E7", "E9", "F", "B", "C901", "C4", "SIM", "RET", "ARG", "PERF", "RUF", "PTH"]

fixable = ["ALL"]
unfixable = []

ignore = ["EM", "CPY001", "G", "UP007", "D", "S101", "E501", "DTZ005"]

[tool.ruff.lint.per-file-ignores]
# Test fakes mirror real library signatures; parameters exist to match
# the API even when unused, and callers pass some by keyword.
"tests/**" = ["ARG001", "ARG002", "ARG003", "ARG005", "RUF029"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.format]
preview = true

docstring-code-format = true
docstring-code-line-length = 20

[tool.vulture]
paths = ["app.py", "src", "pages", "tests"]
min_confidence = 50
sort_by_size = true
ignore_decorators = [
    "@app.route",
    "@app.add_template_filter",
    "@app.template_filter",
    "@commands.command",
    "@bp.route",
    "@command",
    "@Cog.listener",
    "@app.before_serving",
    "@app.before_request",
]
ignore_names = [
    # stdlib callback overrides (html.parser.HTMLParser) are invoked by
    # the parser, not by our code; vulture cannot see the call.
    "handle_*",
    # Pydantic model fields in app.py ServerStatusModel (serialized by framework)
    "memory_total",
    "memory_available",
    "memory_percent",
    "memory_used",
    "memory_free",
    # Jinja2 template filters (called from templates, not Python)
    "format_duration",
    # ASGI entry point (imported by uvicorn via the "app:asgi_app" string in
    # src/__main__.py and the Dockerfile CMD).
    "asgi_app",
    # Page-module entry points: Jinja block names and HTTP verbs, dispatched
    # dynamically (HX-Target / request.method), never referenced as Python names.
    "selector",
    "post",
    # PlaybackSession.previous: session verb dispatched through the panel's
    # verb map (getattr), never referenced as a Python attribute.
    "previous",
    # YtMusicData.uploader: property consumed only from Jinja templates.
    "uploader",
]


[tool.mutmut]
# The whole src package must be in the mutated tree: tests import src.cogs
# and src.bot_state, and a partial copy would shadow the real src package
# with one that cannot import.  pages/ is Quart glue and the page tests
# import it, so it must be walked too (mutmut only copies what it walks).
# app.py and tools/ ride along unmutated (also_copy).
paths_to_mutate = ["src", "pages"]
also_copy = ["app.py", "tools", "templates", "static"]
pytest_add_cli_args_test_selection = ["tests/"]

[tool.djlint]
profile = "jinja"
