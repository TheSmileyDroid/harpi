[project]
name = "harpi"
version = "0.1.0"
requires-python = ">=3.13"
authors = [{ name = "TheSmileyDroid", email = "ghsilha@gmail.com" }]
dependencies = [
    "aiohttp>=3.11",
    "aiosqlite>=0.22.1",
    "discord.py[voice]>=2.5.2",
    "gtts>=2.5.4",
    "loguru>=0.7.3",
    "numpy>=2.4.0",
    "pillow>=11.2.1",
    "psutil>=7.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.1.0",
    "quart>=0.20.0",
    "quart-schema>=0.23.0",
    "uvicorn[standard]>=0.34.3",
    "yt-dlp>=2025.10.22",
    # yt-dlp loads this plugin through its entry point, never through an import.
    "yt-dlp-ejs>=0.3.2",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "radon",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.0",
    "ty>=0.0.65",
    "vulture>=2.16",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
# Real-network tests are never part of the offline gate; run them with
# `pytest -m network` (a CLI -m overrides this one).
addopts = "-m 'not network'"
markers = [
    "network: real-network tests hitting YouTube/CDN (deselect by default)",
]

[tool.ty.src]
exclude = ['web/']

[tool.ruff]
line-length = 79

exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".git-rewrite",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
    "env",
    "web",
]

[tool.ruff.lint]
preview = true

select = [
    "E4",
    "E7",
    "E9",
    "F",
    "B",
    "C901",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "PERF",
    "RUF",
    "PTH",
]

fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
# Test fakes mirror real library signatures; parameters exist to match
# the API even when unused, and callers pass some by keyword.
"tests/**" = ["ARG001", "ARG002", "ARG003", "ARG005", "RUF029"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.format]
preview = true

docstring-code-format = true
docstring-code-line-length = 20

[tool.vulture]
paths = ["app.py", "src", "pages", "tests"]
min_confidence = 50
sort_by_size = true
ignore_decorators = [
    # Route and lifecycle registration: the framework calls these, not us.
    "@app.route",
    "@app.get",
    "@app.post",
    "@app.add_template_filter",
    "@app.template_filter",
    "@commands.command",
    "@bp.route",
    "@bp.get",
    "@bp.post",
    "@bp.put",
    "@bp.patch",
    "@bp.delete",
    "@command",
    "@Cog.listener",
    "@app.before_serving",
    "@app.after_serving",
    "@app.before_request",
    "@app.after_request",
    "@bp.before_request",
    "@bp.after_request",
    "@app.errorhandler",
    "@pytest.fixture",
]
ignore_names = [
    # stdlib callback overrides (html.parser.HTMLParser) are invoked by
    # the parser, not by our code; vulture cannot see the call.
    "handle_*",
    # Pydantic model fields are consumed by the framework, not by our code;
    # vulture sees no reader for a field whose name appears only once.
    "model_config",
    "online",
    "connection",
    "authenticated",
    "scope",
    "read_only",
    "preserve_quotes",
    # YtMusicData.uploader: property consumed through panel serialization.
    "uploader",
    # ASGI entry point (imported by uvicorn via the "app:asgi_app" string in
    # src/__main__.py and the Dockerfile CMD).
    "asgi_app",
    # Module-level pytest attribute (read by pytest, not our code):
    # applies the network marker + banner fixture to network test files.
    "pytestmark",
    # Framework-read flags: Quart's signed-session flag and URL-map slash
    # merging (set in pages/api.py and app.py), plus uvicorn's server stop
    # flag (set in tests); all assigned for the framework to consume.
    "permanent",
    "merge_slashes",
    "should_exit",
    # sqlite3 connection attribute read by the driver, not by our code.
    "row_factory",
    # pytest hook read by the runner, not by our code.
    "pytest_configure",
    # http.server handler methods invoked by the server, not by our code.
    "do_GET",
    "do_HEAD",
    "do_POST",
    "do_PUT",
    "log_message",
]
