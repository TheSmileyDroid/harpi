services:
  backend:
    container_name: harpi-backend
    build: .
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - PYTHONUNBUFFERED=1
      - TZ=UTC
      - HARPI_DB_PATH=/app/data/harpi.db
      - HARPI_WORK_DIR=/work
      - HARPI_LOG_PATH=/work/logs/harpi.log
      - HARPI_VAULT_PATH=/vault
      - PANEL_PUBLIC_MODE=1
    env_file: ".env"
    volumes:
      - ./data:/app/data
      - harpi-work:/work
      - ./cookies.txt:/app/cookies.txt:ro
      - "${HARPI_VAULT_HOST_PATH:?set HARPI_VAULT_HOST_PATH}:/vault:ro"
      - "${HARPI_VAULT_HOST_PATH:?set HARPI_VAULT_HOST_PATH}/Harpi:/vault/Harpi:rw"
    working_dir: /work
    user: "1000:1000"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    mem_reservation: 512m
    networks:
      - harpi-edge
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  harpi-edge:
    external: true

volumes:
  harpi-work:
